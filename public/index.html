<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Envelope Storm — Katıl</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="wrap" style="max-width:480px; padding-top:8vh;">
    <div class="panel" style="text-align:center;">
      <div style="font-size:72px; margin-bottom: -10px;">🌸🐝</div>
      <h1 style="margin:8px 0; color: #ec4899;">Envelope Storm</h1>
      <p class="muted">Öğretmeninden aldığın kodu gir, sonra rolünü seç.</p>
      <div class="form-row" style="margin-top:24px;">
        <input type="text" id="code-input" placeholder="KOD GİR (ÖR. K4T7)" maxlength="6"
               style="text-align:center; font-size:28px; font-weight:800; letter-spacing:8px; text-transform:uppercase; width:100%; padding:18px; border-radius:16px; border:2px solid var(--line); background:#f1f5f9; color:var(--text); outline:none;">
      </div>
      <div id="join-error" style="color:var(--danger); min-height:22px; margin:6px 0;"></div>
      <div class="judge-row" style="margin-top:16px; gap:16px;">
        <button class="btn btn-board" id="board-btn" style="flex:1; padding:20px; font-size:20px; border-radius:16px;">🖥️ Akıllı Tahta</button>
        <button class="btn btn-moderate" id="moderate-btn" style="flex:1; padding:20px; font-size:20px; border-radius:16px;">📱 Öğretmen</button>
      </div>
      <p class="hint" style="margin-top:18px;"><a href="/admin">← Yönetim paneline dön</a></p>
    </div>
  </main>
  <script src="/js/common.js"></script>
  <script src="/js/join.js"></script>
</body>
</html>
